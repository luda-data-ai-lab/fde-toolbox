name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: fde
          POSTGRES_DB: fde_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fde" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,postgres]"
      - name: ruff
        if: matrix.db == 'sqlite'
        run: ruff check . && ruff format --check .
      - name: mypy
        if: matrix.db == 'sqlite'
        run: mypy
      - name: architecture & isolation tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgresql' && 'postgresql+psycopg://fde:fde@localhost:5432/fde_test' || '' }}
        run: pytest tests/architecture tests/isolation
      - name: tests + coverage
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgresql' && 'postgresql+psycopg://fde:fde@localhost:5432/fde_test' || '' }}
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80
          coverage report --include='app/core/*' --fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: no external resources in build output
        run: npm run check:external
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: |
          docker compose exec -T backend python -m app.cli init-admin --email admin@ci.local --password ci-admin-pass-123
          docker compose exec -T backend python -m app.cli seed-assets
          docker compose exec -T backend python -m app.cli seed-demo --password ci-demo-pass-123
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS -o /dev/null http://localhost:8080/
      - if: always()
        run: docker compose logs && docker compose down -v
